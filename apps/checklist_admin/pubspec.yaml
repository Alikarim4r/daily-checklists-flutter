name: checklist_admin
description: MOEHE Facility Daily Inspection — admin permissions and corrections.
publish_to: "none"
version: 1.3.3+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  checklist_shared:
    path: ../../packages/checklist_shared
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  supabase_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/app_icon_simple.png
  adaptive_icon_background: "#6B2D3C"
  adaptive_icon_foreground: assets/branding/app_icon_simple.png
  macos:
    generate: true
    image_path: assets/branding/app_icon_simple.png
  web:
    generate: true
    image_path: assets/branding/app_icon_simple.png
    background_color: "#6B2D3C"
    theme_color: "#8B3A4A"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_simple.png
