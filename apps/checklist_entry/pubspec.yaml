name: checklist_entry
description: CheckIn field inspection app for technicians and inspectors.
publish_to: "none"
version: 1.3.5+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  checklist_shared:
    path: ../../packages/checklist_shared
  in_app_purchase: ^3.3.1
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  signature: ^5.5.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/app_icon_simple.png
  adaptive_icon_background: "#006B62"
  adaptive_icon_foreground: assets/branding/app_icon_simple.png
  macos:
    generate: true
    image_path: assets/branding/app_icon_simple.png
  web:
    generate: true
    image_path: assets/branding/app_icon_simple.png
    background_color: "#0C1514"
    theme_color: "#006B62"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_simple.png
