name: checklist_viewer
description: MOEHE Facility Daily Inspection — viewer/edit app.
publish_to: "none"
version: 1.3.1+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  checklist_shared:
    path: ../../packages/checklist_shared
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  collection: ^1.19.1
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  signature: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/app_icon_simple.png
  adaptive_icon_background: "#1B2430"
  adaptive_icon_foreground: assets/branding/app_icon_simple.png
  macos:
    generate: true
    image_path: assets/branding/app_icon_simple.png
  web:
    generate: true
    image_path: assets/branding/app_icon_simple.png
    background_color: "#1B2430"
    theme_color: "#3D5A80"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_simple.png
