name: checklist_shared
description: Shared models, Supabase services, and checklist data for MOEHE Daily Checklists.
version: 0.2.0
publish_to: "none"

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  image: ^4.5.4
  path: ^1.9.1
  intl: ^0.20.2
  collection: ^1.19.1
  shared_preferences: ^2.5.3
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/moehe_logo.png
    - assets/branding/moehe_logo_drive.png
    - assets/branding/logo_waseef.png
    - assets/branding/logo_footer2.png
    - assets/ui_labels.json
    - assets/buildings.json
    - assets/checklist_lists.json
    - assets/data/checklist_catalog.json
